name: Apply verified transition patch

on:
  push:
    paths:
      - '.transition-upload/**'
      - '.github/workflows/apply-transition-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/transition-verifier-v1
          fetch-depth: 0

      - name: Apply verified patch and clean temporary infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cat .transition-upload/chunk-* | base64 -d | gzip -d > /tmp/transition-final.patch
          git apply --check /tmp/transition-final.patch
          git apply /tmp/transition-final.patch
          rm -rf .transition-upload
          rm -f .github/workflows/apply-transition-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: verify memory transitions before commit"
          git push origin HEAD:feat/transition-verifier-v1
