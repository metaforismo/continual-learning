name: Gate and merge PR6

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: finalize-pr6-runtime
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fts5-projection-v1-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Remove the one-shot gate and publish the final head
        run: |
          rm -f .github/workflows/gate-merge-pr6.yml
          git config user.name metaforismo
          git config user.email 39646696+metaforismo@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove the one-shot PR6 gate"
            git push origin HEAD:feat/fts5-projection-v1-final
          fi
      - name: Verify changed-file boundary and exact branch
        run: |
          git fetch origin main feat/fts5-projection-v1-final
          git reset --hard origin/feat/fts5-projection-v1-final
          unexpected="$(git diff --name-only origin/main...HEAD | grep -E '^(\.github/workflows/(apply-fts5|finalize-pr6|gate-merge-pr6|source-export)|dist/|node_modules/|.*debug.*|.*\.sqlite($|-))' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated or workflow files remain:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check origin/main...HEAD
      - name: Verify a synthetic merge with current main
        run: |
          rm -rf /tmp/pr6-merge-check
          git worktree add --detach /tmp/pr6-merge-check origin/main
          git -C /tmp/pr6-merge-check merge --no-commit --no-ff origin/feat/fts5-projection-v1-final
          npm ci --prefix /tmp/pr6-merge-check --ignore-scripts --no-audit --no-fund
          npm --prefix /tmp/pr6-merge-check run check
          git worktree remove --force /tmp/pr6-merge-check
      - name: Require the real PR-head CI
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 60); do
            row="$(gh run list --repo metaforismo/continual-learning --workflow CI --branch feat/fts5-projection-v1-final --event pull_request --limit 20 --json headSha,status,conclusion,databaseId --jq '.[] | select(.headSha == "'"$head_sha"'") | [.status,.conclusion,.databaseId] | @tsv' | head -n1)"
            status="$(printf '%s' "$row" | cut -f1)"
            conclusion="$(printf '%s' "$row" | cut -f2)"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 5
          done
          echo "No successful CI run completed for exact PR head $head_sha" >&2
          exit 1
      - name: Ready and squash-merge the reviewed PR
        run: |
          test "$(gh pr view 6 --repo metaforismo/continual-learning --json headRefOid --jq .headRefOid)" = "$(git rev-parse HEAD)"
          gh pr ready 6 --repo metaforismo/continual-learning
          gh pr merge 6 --repo metaforismo/continual-learning --squash --delete-branch
          gh pr close 5 --repo metaforismo/continual-learning --comment "Superseded by the reviewed final FTS5 implementation in #6." 2>/dev/null || true
      - name: Remove accidental scratch branches
        if: success()
        run: |
          for branch in \
            noop-check \
            fix/pr6-node-sqlite-types \
            feat/fts5-projection-v1-final-repair \
            fix-sqlite-ambient-temp \
            fix-sqlite-ambient-temp2 \
            fix-sqlite-ambient-temp3 \
            fix-sqlite-ambient-temp4 \
            feat/durable-ledger-v1; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
