name: Apply reviewed FTS5 fixes

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fts5-projection-v1-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Projection options and public root export.
          replace_once(
              'src/retrieval/types.ts',
              "  readonly searchableSensitivities?: readonly EvidenceRecord['sensitivity'][];\n  readonly busyTimeoutMs?: number;",
              "  readonly searchableSensitivities?: readonly EvidenceRecord['sensitivity'][];\n  /**\n   * Claim values have no independent sensitivity field yet. They are therefore omitted from the\n   * plaintext index by default even when their supporting evidence is searchable.\n   */\n  readonly indexClaimValues?: boolean;\n  readonly busyTimeoutMs?: number;",
          )

          p = Path('src/retrieval/canonical.ts')
          text = p.read_text()
          replacements = [
              (
                  'export const MAX_QUERY_TOKEN_LENGTH = 96;\n',
                  'export const MAX_QUERY_TOKEN_LENGTH = 96;\nexport const MAX_QUERY_CHARACTERS = 4_096;\n',
              ),
              (
                  "export function assertScopeChain(scopeChain: readonly string[]): void {\n  if (scopeChain.length === 0) throw new Error('scopeChain requires at least one value');",
                  "export function assertScopeChain(scopeChain: readonly string[]): void {\n  if (!Array.isArray(scopeChain)) throw new TypeError('scopeChain must be an array');\n  if (scopeChain.length === 0) throw new Error('scopeChain requires at least one value');",
              ),
              (
                  "  if (scopeChain.some((scope) => scope.trim().length === 0)) {\n    throw new Error('scopeChain cannot contain empty values');\n  }",
                  "  if (scopeChain.some((scope) => typeof scope !== 'string')) {\n    throw new TypeError('scopeChain values must be strings');\n  }\n  if (scopeChain.some((scope) => scope.trim().length === 0)) {\n    throw new Error('scopeChain cannot contain empty values');\n  }",
              ),
              (
                  "export function safeMatchQuery(query: string, maxTokens = DEFAULT_MAX_QUERY_TOKENS): string {\n  if (!Number.isInteger(maxTokens) || maxTokens <= 0 || maxTokens > 64) {",
                  "export function safeMatchQuery(query: string, maxTokens = DEFAULT_MAX_QUERY_TOKENS): string {\n  if (typeof query !== 'string') throw new TypeError('FTS query must be a string');\n  if (query.length > MAX_QUERY_CHARACTERS) {\n    throw new RangeError(`FTS query cannot exceed ${MAX_QUERY_CHARACTERS} characters`);\n  }\n  if (!Number.isInteger(maxTokens) || maxTokens <= 0 || maxTokens > 64) {",
              ),
              (
                  "export function claimText(claim: ClaimRecord): string {\n  return [\n    claim.key.subject,\n    claim.key.predicate,\n    ...claim.tags,\n    canonicalJson(claim.value as JsonValue),\n  ].join('\\n');\n}",
                  "export function claimText(claim: ClaimRecord, includeValue = false): string {\n  return [\n    claim.key.subject,\n    claim.key.predicate,\n    ...claim.tags,\n    ...(includeValue ? [canonicalJson(claim.value as JsonValue)] : []),\n  ].join('\\n');\n}",
              ),
              (
                  "export function buildDocuments(\n  events: readonly MemoryEvent[],\n  allowedSensitivities: ReadonlySet<EvidenceRecord['sensitivity']>,\n): readonly IndexedDocument[] {",
                  "export function buildDocuments(\n  events: readonly MemoryEvent[],\n  allowedSensitivities: ReadonlySet<EvidenceRecord['sensitivity']>,\n  includeClaimValues = false,\n): readonly IndexedDocument[] {",
              ),
              ('searchText: claimText(claim),', 'searchText: claimText(claim, includeClaimValues),'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing canonical.ts block: {old[:80]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('src/index.ts')
          text = p.read_text()
          if "export * from './retrieval/index.js';" not in text:
              p.write_text(text + "export * from './retrieval/index.js';\n")

          # FTS runtime: read-snapshot search, canonical-only rehydration, bounded candidates, and
          # claim-value opt-in.
          p = Path('src/retrieval/fts5.ts')
          text = p.read_text()
          replacements = [
              ('const MAX_LIMIT = 100;\nconst META_ROW_ID = 1;', 'const MAX_LIMIT = 100;\nconst MAX_REHYDRATE_CANDIDATES = 100;\nconst META_ROW_ID = 1;'),
              (
                  "  readonly #allowedSensitivities: ReadonlySet<EvidenceRecord['sensitivity']>;\n  readonly #faultInjector: Fts5ProjectionOptions['faultInjector'] | undefined;",
                  "  readonly #allowedSensitivities: ReadonlySet<EvidenceRecord['sensitivity']>;\n  readonly #indexClaimValues: boolean;\n  readonly #faultInjector: Fts5ProjectionOptions['faultInjector'] | undefined;",
              ),
              (
                  "    this.#allowedSensitivities = new Set(sensitivities);\n    this.#faultInjector = options.faultInjector;",
                  "    this.#allowedSensitivities = new Set(sensitivities);\n    if (\n      options.indexClaimValues !== undefined &&\n      typeof options.indexClaimValues !== 'boolean'\n    ) {\n      throw new TypeError('indexClaimValues must be boolean');\n    }\n    this.#indexClaimValues = options.indexClaimValues ?? false;\n    this.#faultInjector = options.faultInjector;",
              ),
              (
                  "  watermark(): Fts5ProjectionWatermark | undefined {\n    return this.#meta();\n  }\n\n  #generationIntegrityFailure",
                  "  watermark(): Fts5ProjectionWatermark | undefined {\n    return this.#meta();\n  }\n\n  #withReadTransaction<T>(operation: () => T): T {\n    this.#assertOpen();\n    this.#db.exec('BEGIN');\n    try {\n      const result = operation();\n      this.#db.exec('COMMIT');\n      return result;\n    } catch (error) {\n      try {\n        this.#db.exec('ROLLBACK');\n      } catch {\n        // Preserve the original failure. Reopen/rebuild remains the cache recovery boundary.\n      }\n      throw error;\n    }\n  }\n\n  #generationIntegrityFailure",
              ),
              (
                  'const documents = buildDocuments(current.events, this.#allowedSensitivities);',
                  'const documents = buildDocuments(\n      current.events,\n      this.#allowedSensitivities,\n      this.#indexClaimValues,\n    );',
              ),
              ('searchText: claimText(claim),', 'searchText: claimText(claim, this.#indexClaimValues),'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing fts5.ts block: {old[:100]!r}')
              text = text.replace(old, new, 1)

          start = text.index('  status(events: readonly MemoryEvent[]): Fts5ProjectionStatus {')
          end = text.index('\n  rebuild(events:', start)
          text = text[:start] + '''  #statusForSnapshot(current: Fts5ProjectionSnapshot): Fts5ProjectionStatus {
            const watermark = this.#meta();
            if (watermark === undefined) {
              return Object.freeze({
                initialized: false,
                fresh: false,
                canonicalFingerprint: current.fingerprint,
                eventCount: current.events.length,
                reason: 'projection has not been built',
              });
            }
            const integrityFailure = this.#generationIntegrityFailure(watermark);
            const watermarkFresh =
              watermark.canonicalFingerprint === current.fingerprint &&
              watermark.eventCount === current.events.length &&
              watermark.lastSeq === (current.events.at(-1)?.seq ?? 0);
            const fresh = watermarkFresh && integrityFailure === undefined;
            return Object.freeze({
              initialized: true,
              fresh,
              watermark,
              canonicalFingerprint: current.fingerprint,
              eventCount: current.events.length,
              reason:
                integrityFailure !== undefined
                  ? `projection integrity failed: ${integrityFailure}`
                  : fresh
                    ? 'projection watermark matches canonical memory'
                    : 'projection watermark is stale',
            });
          }

          status(events: readonly MemoryEvent[]): Fts5ProjectionStatus {
            const current = snapshot(events);
            return this.#withReadTransaction(() => this.#statusForSnapshot(current));
          }
''' + text[end:]

          start = text.index('  search(\n')
          end = text.index('\n  rehydrate(', start)
          text = text[:start] + '''  search(
            events: readonly MemoryEvent[],
            query: string,
            options: Fts5SearchOptions,
          ): readonly Fts5SearchCandidate[] {
            this.#assertOpen();
            assertScopeChain(options.scopeChain);
            const view = normalizeView(options.view);
            const limit = options.limit ?? DEFAULT_LIMIT;
            if (!Number.isInteger(limit) || limit <= 0 || limit > MAX_LIMIT) {
              throw new RangeError(`FTS result limit must be an integer in [1, ${MAX_LIMIT}]`);
            }
            const match = safeMatchQuery(query, options.maxQueryTokens);
            const current = snapshot(events);

            return this.#withReadTransaction(() => {
              const state = this.#statusForSnapshot(current);
              if (!state.fresh || state.watermark === undefined) {
                throw new Error(`FTS projection is unavailable: ${state.reason}`);
              }
              const watermark = state.watermark;
              const scopePlaceholders = options.scopeChain.map(() => '?').join(', ');
              const lifecycleClause =
                view === 'current' ? "AND (kind <> 'claim' OR lifecycle = 'active')" : '';
              const rows = this.#db
                .prepare(`
                  SELECT canonical_id, kind, scope, lifecycle, source_digest, entry_digest,
                         search_text, CAST(generation AS INTEGER) AS generation,
                         bm25(cl_fts_entries) AS fts_score
                    FROM cl_fts_entries
                   WHERE cl_fts_entries MATCH ?
                     AND generation = ?
                     AND scope IN (${scopePlaceholders})
                     ${lifecycleClause}
                   ORDER BY fts_score ASC, kind ASC, canonical_id ASC
                   LIMIT ?
                `)
                .all(
                  match,
                  watermark.generation,
                  ...options.scopeChain,
                  limit,
                ) as unknown as readonly SearchRow[];

              return Object.freeze(
                rows.map((row, index) => {
                  if (row.kind !== 'evidence' && row.kind !== 'claim') {
                    throw new Error(`FTS projection contains an unknown document kind: ${row.kind}`);
                  }
                  if (
                    typeof row.canonical_id !== 'string' ||
                    row.canonical_id.trim().length === 0 ||
                    typeof row.scope !== 'string' ||
                    row.scope.trim().length === 0
                  ) {
                    throw new Error('FTS projection row contains an invalid canonical identity or scope');
                  }
                  if (!Number.isInteger(row.generation) || row.generation !== watermark.generation) {
                    throw new Error('FTS projection returned a row from an inactive generation');
                  }
                  if (
                    !SHA256_PATTERN.test(row.source_digest) ||
                    !SHA256_PATTERN.test(row.entry_digest)
                  ) {
                    throw new Error('FTS projection row contains a malformed digest');
                  }
                  if (typeof row.fts_score !== 'number' || !Number.isFinite(row.fts_score)) {
                    throw new Error('FTS projection returned a malformed BM25 score');
                  }
                  const lifecycle =
                    row.kind === 'claim'
                      ? row.lifecycle === 'active' || row.lifecycle === 'superseded'
                        ? row.lifecycle
                        : undefined
                      : undefined;
                  if (row.kind === 'claim' && lifecycle === undefined) {
                    throw new Error(`FTS projection claim ${row.canonical_id} has an invalid lifecycle`);
                  }
                  const base = Object.freeze({
                    canonicalId: row.canonical_id,
                    kind: row.kind,
                    scope: row.scope,
                    lifecycle: lifecycle ?? ('' as const),
                    sourceDigest: row.source_digest,
                    searchText: row.search_text,
                  });
                  if (documentDigest(base) !== row.entry_digest) {
                    throw new Error(
                      `FTS projection row integrity failed for ${row.kind}/${row.canonical_id}`,
                    );
                  }
                  return Object.freeze({
                    canonicalId: row.canonical_id,
                    kind: row.kind,
                    scope: row.scope,
                    ...(lifecycle === undefined ? {} : { lifecycle }),
                    rank: index + 1,
                    score: -row.fts_score,
                    entryDigest: row.entry_digest,
                    canonicalFingerprint: watermark.canonicalFingerprint,
                    generation: watermark.generation,
                  });
                }),
              );
            });
          }
''' + text[end:]

          old = '''  rehydrate(
            events: readonly MemoryEvent[],
            candidates: readonly Fts5SearchCandidate[],
            options: Fts5RehydrateOptions,
          ): readonly RehydratedFts5Candidate[] {
            this.#assertOpen();
            assertScopeChain(options.scopeChain);
            const view = normalizeView(options.view);
            const state = this.status(events);
            if (!state.fresh || state.watermark === undefined) {
              throw new Error(`FTS projection is unavailable: ${state.reason}`);
            }
            const watermark = state.watermark;
            const allowedScopes = new Set(options.scopeChain);'''
          new = '''  rehydrate(
            events: readonly MemoryEvent[],
            candidates: readonly Fts5SearchCandidate[],
            options: Fts5RehydrateOptions,
          ): readonly RehydratedFts5Candidate[] {
            assertScopeChain(options.scopeChain);
            if (!Array.isArray(candidates)) throw new TypeError('FTS candidates must be an array');
            if (candidates.length > MAX_REHYDRATE_CANDIDATES) {
              throw new RangeError(
                `FTS rehydration cannot exceed ${MAX_REHYDRATE_CANDIDATES} candidates`,
              );
            }
            const view = normalizeView(options.view);
            const current = snapshot(events);
            const allowedScopes = new Set(options.scopeChain);'''
          if old not in text:
              raise SystemExit('missing rehydrate prelude')
          text = text.replace(old, new, 1)

          old = '''      if (
                candidate.canonicalFingerprint !== watermark.canonicalFingerprint ||
                candidate.generation !== watermark.generation
              ) {
                throw new Error(`FTS candidate ${candidate.canonicalId} belongs to a stale projection`);
              }
              if (!allowedScopes.has(candidate.scope)) {'''
          new = '''      if (candidate.kind !== 'evidence' && candidate.kind !== 'claim') {
                throw new Error(`FTS candidate has an unknown kind: ${String(candidate.kind)}`);
              }
              if (
                typeof candidate.canonicalId !== 'string' ||
                candidate.canonicalId.trim().length === 0 ||
                typeof candidate.scope !== 'string' ||
                candidate.scope.trim().length === 0 ||
                !Number.isInteger(candidate.generation) ||
                candidate.generation <= 0 ||
                !Number.isInteger(candidate.rank) ||
                candidate.rank <= 0 ||
                !SHA256_PATTERN.test(candidate.entryDigest) ||
                !SHA256_PATTERN.test(candidate.canonicalFingerprint)
              ) {
                throw new Error('FTS candidate metadata is malformed');
              }
              if (candidate.canonicalFingerprint !== current.fingerprint) {
                throw new Error(`FTS candidate ${candidate.canonicalId} belongs to a stale projection`);
              }
              if (!allowedScopes.has(candidate.scope)) {'''
          if old not in text:
              raise SystemExit('missing rehydrate candidate check')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Base test query now exercises claim metadata rather than the value that is private by
          # default.
          replace_once(
              'test/fts5-projection.test.mjs',
              "const candidates = projection.search(kernel.events(), 'zed editor', {",
              "const candidates = projection.search(kernel.events(), 'editor preference', {",
          )

          p = Path('test/fts5-projection-adversarial.test.mjs')
          p.write_text(p.read_text() + r'''

          test('claim values are omitted from plaintext FTS unless the host explicitly opts in', () => {
            const files = fixture();
            try {
              const kernel = new MemoryKernel();
              const source = evidence('claim-metadata-source', {
                preview: 'generic preference observation',
              });
              appendEvidence(kernel, source, 1);
              kernel.assertClaim(
                { eventId: 'assert-value-canary', recordedAt: 2, actor: 'writer' },
                {
                  id: 'value-canary-claim',
                  key: {
                    scope: 'project/search',
                    subject: 'project-search',
                    predicate: 'preferred-editor',
                  },
                  value: 'quasar-value-canary',
                  valid: { from: 2 },
                  authority: source.authority,
                  epistemicStatus: 'observed',
                  confidence: 1,
                  evidence: [{
                    sourceId: source.id,
                    sourceGroups: source.sourceGroups,
                    authority: source.authority,
                    contentHash: source.artifact.digest,
                    roles: ['supports'],
                  }],
                  derivedFrom: [],
                  tags: ['editor', 'preference'],
                },
                { authorizeImmediately: true },
              );
              const projection = SqliteFts5Projection.open(files.filename);
              projection.rebuild(kernel.events(), 3);
              assert.equal(
                projection.search(kernel.events(), 'quasar-value-canary', {
                  scopeChain: ['project/search'],
                }).some((candidate) => candidate.canonicalId === 'value-canary-claim'),
                false,
              );
              assert.equal(
                projection.search(kernel.events(), 'editor preference', {
                  scopeChain: ['project/search'],
                }).some((candidate) => candidate.canonicalId === 'value-canary-claim'),
                true,
              );
              projection.close();
            } finally {
              files.cleanup();
            }
          });

          test('query character count is bounded before Unicode tokenization', () => {
            const files = fixture();
            try {
              const kernel = new MemoryKernel();
              appendEvidence(kernel, evidence('query-size-source', { preview: 'bounded query phrase' }));
              const projection = SqliteFts5Projection.open(files.filename);
              projection.rebuild(kernel.events(), 2);
              assert.throws(
                () => projection.search(kernel.events(), 'x'.repeat(4_097), {
                  scopeChain: ['project/search'],
                }),
                /cannot exceed 4096 characters/,
              );
              projection.close();
            } finally {
              files.cleanup();
            }
          });

          test('rehydration is bounded and remains valid after the disposable cache is closed', () => {
            const files = fixture();
            try {
              const kernel = new MemoryKernel();
              appendEvidence(kernel, evidence('portable-candidate', { preview: 'portable candidate phrase' }));
              const projection = SqliteFts5Projection.open(files.filename);
              projection.rebuild(kernel.events(), 2);
              const candidates = projection.search(kernel.events(), 'portable candidate', {
                scopeChain: ['project/search'],
              });
              projection.close();
              const hydrated = projection.rehydrate(kernel.events(), candidates, {
                scopeChain: ['project/search'],
              });
              assert.equal(hydrated[0]?.candidate.canonicalId, 'portable-candidate');
              const oversized = Array.from({ length: 101 }, (_, index) => ({
                ...candidates[0],
                canonicalId: `candidate-${index}`,
                rank: index + 1,
              }));
              assert.throws(
                () => projection.rehydrate(kernel.events(), oversized, {
                  scopeChain: ['project/search'],
                }),
                /cannot exceed 100 candidates/,
              );
            } finally {
              files.cleanup();
            }
          });

          test('search uses one SQLite read snapshot across integrity validation and MATCH', () => {
            const files = fixture();
            try {
              const kernel = new MemoryKernel();
              appendEvidence(kernel, evidence('snapshot-source', { preview: 'snapshot race phrase' }));
              const writer = SqliteFts5Projection.open(files.filename);
              writer.rebuild(kernel.events(), 2);
              const rawReader = new DatabaseSync(files.filename);
              let rebuilt = false;
              const readerDb = {
                exec(sql) { return rawReader.exec(sql); },
                prepare(sql) {
                  if (!rebuilt && sql.includes('bm25(cl_fts_entries)')) {
                    rebuilt = true;
                    writer.rebuild(kernel.events(), 3);
                  }
                  return rawReader.prepare(sql);
                },
                close() { rawReader.close(); },
              };
              const reader = new SqliteFts5Projection(readerDb);
              const candidates = reader.search(kernel.events(), 'snapshot race', {
                scopeChain: ['project/search'],
              });
              assert.equal(rebuilt, true);
              assert.equal(candidates[0]?.canonicalId, 'snapshot-source');
              const hydrated = reader.rehydrate(kernel.events(), candidates, {
                scopeChain: ['project/search'],
              });
              assert.equal(hydrated[0]?.record.id, 'snapshot-source');
              reader.close();
              rawReader.close();
              writer.close();
            } finally {
              files.cleanup();
            }
          });

          test('claim-value indexing requires an explicit boolean opt-in', () => {
            const files = fixture();
            try {
              const kernel = new MemoryKernel();
              const source = evidence('claim-value-source', { preview: 'generic editor observation' });
              appendEvidence(kernel, source, 1);
              kernel.assertClaim(
                { eventId: 'assert-opt-in-value', recordedAt: 2, actor: 'writer' },
                {
                  id: 'opt-in-value-claim',
                  key: {
                    scope: 'project/search',
                    subject: 'project-search',
                    predicate: 'preferred-editor',
                  },
                  value: 'heliosphere-editor',
                  valid: { from: 2 },
                  authority: source.authority,
                  epistemicStatus: 'observed',
                  confidence: 1,
                  evidence: [{
                    sourceId: source.id,
                    sourceGroups: source.sourceGroups,
                    authority: source.authority,
                    contentHash: source.artifact.digest,
                    roles: ['supports'],
                  }],
                  derivedFrom: [],
                  tags: ['editor'],
                },
                { authorizeImmediately: true },
              );
              assert.throws(
                () => SqliteFts5Projection.open(files.filename, { indexClaimValues: 'yes' }),
                /must be boolean/,
              );
              const projection = SqliteFts5Projection.open(files.filename, {
                indexClaimValues: true,
              });
              projection.rebuild(kernel.events(), 3);
              assert.equal(
                projection.search(kernel.events(), 'heliosphere-editor', {
                  scopeChain: ['project/search'],
                }).some((candidate) => candidate.canonicalId === 'opt-in-value-claim'),
                true,
              );
              projection.close();
            } finally {
              files.cleanup();
            }
          });

          test('a same-length canonical fork cannot replace an existing projection', () => {
            const files = fixture();
            try {
              const left = new MemoryKernel();
              appendEvidence(left, evidence('fork-left', { preview: 'left fork phrase' }), 1);
              const right = new MemoryKernel();
              appendEvidence(right, evidence('fork-right', {
                preview: 'right fork phrase',
                artifact: { ...evidence('fork-right').artifact, digest: sha('fork-right-unique') },
                sourceGroups: ['origin-fork-right-unique'],
              }), 1);
              const projection = SqliteFts5Projection.open(files.filename);
              const original = projection.rebuild(left.events(), 2);
              assert.throws(
                () => projection.rebuild(right.events(), 3),
                /same-length canonical fork/,
              );
              assert.equal(projection.watermark()?.canonicalFingerprint, original.canonicalFingerprint);
              assert.equal(
                projection.search(left.events(), 'left fork', {
                  scopeChain: ['project/search'],
                })[0]?.canonicalId,
                'fork-left',
              );
              projection.close();
            } finally {
              files.cleanup();
            }
          });
          ''')

          # Documentation alignment.
          p = Path('docs/FTS5_PROJECTION.md')
          text = p.read_text()
          marker = "A failure at any phase rolls the transaction back, leaving the prior generation usable. Reading the watermark after acquiring the write lock prevents concurrent rebuilders from independently choosing the same generation or regressing a newer committed snapshot.\n"
          if marker not in text:
              raise SystemExit('missing FTS generation docs marker')
          text = text.replace(marker, marker + "\nSearch performs watermark validation, manifest verification, and `MATCH` inside one SQLite read transaction. A concurrent rebuild may publish a newer generation, but the in-flight reader continues to see the complete older snapshot instead of observing a deleted generation and returning a false empty result.\n", 1)
          marker = "personal / sensitive / secret evidence under the default policy\n```\n"
          if marker not in text:
              raise SystemExit('missing FTS privacy docs marker')
          text = text.replace(marker, marker + "\nClaim values are omitted by default even when their evidence is searchable, because the current claim schema has no independent sensitivity label for the derived value. Subject, predicate, and tags remain searchable. A host may set `indexClaimValues: true` only as an explicit privacy decision.\n", 1)
          marker = "The caller must rehydrate from canonical projections. Current search excludes superseded claims; historical search may recover them but still preserves their lifecycle.\n"
          if marker not in text:
              raise SystemExit('missing FTS rehydration docs marker')
          text = text.replace(marker, marker + "\nRehydration is independent of cache survival. A candidate remains checkable after the cache is closed or rebuilt when its canonical fingerprint and freshly recomputed entry digest still match. Candidate batches are bounded.\n", 1)
          p.write_text(text)

          p = Path('README.md')
          text = p.read_text()
          if 'rebuildable SQLite FTS5 lexical projection' not in text:
              marker = '\nThe kernel intentionally'
              if marker not in text:
                  marker = '\nThe core intentionally'
              if marker not in text:
                  raise SystemExit('missing README implementation marker')
              text = text.replace(marker, "- a rebuildable SQLite FTS5 lexical projection with exact watermarks, manifest integrity, bounded scope/query fan-in, candidate-only output, and canonical rehydration;\n" + marker, 1)
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('The test suite currently exercises '):
                  lines[index] = 'The test suite currently exercises 137 foundational, durability, transition, state-adjudication, and lexical-projection scenarios.'
                  break
          else:
              raise SystemExit('missing README test-count line')
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          if '[FTS5 lexical projection](docs/FTS5_PROJECTION.md)' not in text:
              marker = '- [Evaluation and evidence ladder](docs/EVALUATION.md)'
              if marker not in text:
                  raise SystemExit('missing README docs marker')
              text = text.replace(marker, '- [FTS5 lexical projection](docs/FTS5_PROJECTION.md)\n' + marker, 1)
          p.write_text(text)

          p = Path('docs/ROADMAP.md')
          text = p.read_text()
          text = text.replace(
              '- FTS5 lexical index;',
              '- [x] rebuildable SQLite FTS5 lexical projection with exact watermark, manifest integrity, bounded queries, and canonical rehydration;',
              1,
          )
          text = text.replace(
              '- index watermarks and rebuild commands;',
              '- [x] FTS5 generation watermark and atomic full rebuild command;',
              1,
          )
          p.write_text(text)

          p = Path('AGENTS.md')
          text = p.read_text()
          if 'Search indexes are rebuildable caches' not in text:
              marker = '- All learned behavior must be inspectable, suppressible, and testable.'
              if marker not in text:
                  raise SystemExit('missing AGENTS invariant marker')
              text = text.replace(marker, '- Search indexes are rebuildable caches. Candidate hits must be rehydrated from canonical state before context or action.\n' + marker, 1)
          p.write_text(text)
          PY
