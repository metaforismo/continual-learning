name: Probe Node SQLite FTS5 (temporary)

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: read

jobs:
  probe:
    name: Node 22.16.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Probe compile options and FTS5 creation
        shell: bash
        run: |
          node --no-warnings - <<'NODE'
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync(':memory:');
          const options = db.prepare('PRAGMA compile_options').all().map((row) => Object.values(row)[0]);
          const enabled = options.includes('ENABLE_FTS5');
          let create = false;
          let error = '';
          try {
            db.exec('CREATE VIRTUAL TABLE probe USING fts5(content)');
            create = true;
          } catch (cause) {
            error = cause instanceof Error ? cause.message : String(cause);
          }
          console.log(JSON.stringify({
            node: process.version,
            sqlite: db.prepare('SELECT sqlite_version() AS version').get().version,
            enableFts5: enabled,
            createVirtualTable: create,
            error,
          }));
          db.close();
          NODE
