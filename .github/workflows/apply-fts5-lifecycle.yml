name: Align FTS5 lifecycle semantics

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fts5-projection-v1-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lifecycle boundary
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing block in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/retrieval/types.ts',
              "export type Fts5ProjectionView = 'current' | 'historical';",
              "export type Fts5ClaimLifecycleFilter = 'all' | 'active-only';",
          )
          p = Path('src/retrieval/types.ts')
          text = p.read_text().replace(
              '  readonly view?: Fts5ProjectionView;',
              '  readonly claimLifecycle?: Fts5ClaimLifecycleFilter;',
          )
          p.write_text(text)

          p = Path('src/retrieval/canonical.ts')
          text = p.read_text()
          text = text.replace(
              "import type { Fts5ProjectionDocumentKind, Fts5ProjectionView } from './types.js';",
              "import {\n  FTS5_PROJECTION_SCHEMA_VERSION,\n  type Fts5ClaimLifecycleFilter,\n  type Fts5ProjectionDocumentKind,\n} from './types.js';",
              1,
          )
          old = "export function normalizeView(value: Fts5ProjectionView | undefined): Fts5ProjectionView {\n  const view = value ?? 'current';\n  if (view !== 'current' && view !== 'historical') {\n    throw new Error('FTS projection view must be current or historical');\n  }\n  return view;\n}"
          new = "export function normalizeClaimLifecycleFilter(\n  value: Fts5ClaimLifecycleFilter | undefined,\n): Fts5ClaimLifecycleFilter {\n  const filter = value ?? 'all';\n  if (filter !== 'all' && filter !== 'active-only') {\n    throw new Error('FTS claimLifecycle must be all or active-only');\n  }\n  return filter;\n}"
          if old not in text:
              raise SystemExit('missing normalizeView block')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    schemaVersion: 1,',
              '    schemaVersion: FTS5_PROJECTION_SCHEMA_VERSION,',
              1,
          )
          p.write_text(text)

          p = Path('src/retrieval/fts5.ts')
          text = p.read_text().replace(
              '  normalizeView,\n',
              '  normalizeClaimLifecycleFilter,\n',
              1,
          )
          text = text.replace(
              'const view = normalizeView(options.view);',
              'const claimLifecycle = normalizeClaimLifecycleFilter(options.claimLifecycle);',
              1,
          )
          old = "      const lifecycleClause =\n        view === 'current' ? \"AND (kind <> 'claim' OR lifecycle = 'active')\" : '';"
          new = "      const lifecycleClause =\n        claimLifecycle === 'active-only'\n          ? \"AND (kind <> 'claim' OR lifecycle = 'active')\"\n          : '';"
          if old not in text:
              raise SystemExit('missing search lifecycle block')
          text = text.replace(old, new, 1)
          at = text.index('  rehydrate(')
          prefix, suffix = text[:at], text[at:]
          suffix = suffix.replace(
              'const view = normalizeView(options.view);',
              'const claimLifecycle = normalizeClaimLifecycleFilter(options.claimLifecycle);',
              1,
          )
          suffix = suffix.replace(
              "(view === 'current' && lifecycle !== 'active')",
              "(claimLifecycle === 'active-only' && lifecycle !== 'active')",
              1,
          )
          p.write_text(prefix + suffix)

          p = Path('test/fts5-projection.test.mjs')
          text = p.read_text()
          text = text.replace(
              "test('historical search can recall superseded claims while current search cannot', () => {",
              "test('FTS preserves superseded lifecycle and only filters it on explicit active-only request', () => {",
              1,
          )
          text = text.replace("      view: 'current',", "      claimLifecycle: 'active-only',")
          text = text.replace("      view: 'historical',", "      claimLifecycle: 'all',")
          p.write_text(text)

          p = Path('docs/FTS5_PROJECTION.md')
          text = p.read_text()
          marker = 'The index is disposable. It never authorizes a fact, procedure, outcome, or instruction.\n'
          if marker not in text:
              raise SystemExit('missing docs trust marker')
          if 'A zero-result lexical query is not evidence' not in text:
              text = text.replace(
                  marker,
                  marker + '\nA zero-result lexical query is not evidence that no memory exists. FTS is one candidate generator; exhaustive or safety-critical absence claims require a canonical coverage protocol or additional retrievers.\n',
                  1,
              )
          old = 'The caller must rehydrate from canonical projections. Current search excludes superseded claims; historical search may recover them but still preserves their lifecycle.\n'
          new = "The caller must rehydrate from canonical projections. Lexical retrieval includes both active and superseded claim candidates by default so that it cannot silently discard a still-relevant or historically requested memory. `claimLifecycle: active-only` is an optional transaction-lifecycle optimization, not a statement of world-time truth. Bitemporal current/historical validity remains the state adjudicator's responsibility.\n"
          if old not in text:
              raise SystemExit('missing docs lifecycle paragraph')
          text = text.replace(old, new, 1)
          text = text.replace(
              '- protection against an operator who can forge both cache rows and cache metadata.',
              '- protection against an operator who can forge both cache rows and cache metadata;\n- completeness guarantees for FTS shadow-index corruption or a zero-result query.',
              1,
          )
          p.write_text(text)

          p = Path('AGENTS.md')
          text = p.read_text()
          marker = '- Search indexes are rebuildable caches. Candidate hits must be rehydrated from canonical state before context or action.'
          if marker not in text:
              raise SystemExit('missing AGENTS cache invariant')
          if 'A retrieval miss is not evidence of absence' not in text:
              text = text.replace(
                  marker,
                  marker + '\n- A retrieval miss is not evidence of absence; exhaustive claims require an explicit coverage protocol.',
                  1,
              )
          p.write_text(text)
          PY
      - name: Verify branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check
      - name: Commit lifecycle boundary
        run: |
          rm .github/workflows/apply-fts5-lifecycle.yml
          git config user.name metaforismo
          git config user.email 39646696+metaforismo@users.noreply.github.com
          git add -A
          git commit -m "fix: keep lexical retrieval non-authoritative"
          git push origin HEAD:feat/fts5-projection-v1-final
