name: Source Export PR6 (temporary)

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: fts5-pr6-source
          path: .
          include-hidden-files: true
          retention-days: 1
