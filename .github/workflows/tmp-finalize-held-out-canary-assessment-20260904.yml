name: Temporary finalize held-out canary assessment 20260904

on:
  push:
    branches:
      - tmp/finalize-held-out-canary-assessment-20260904

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: finalize-held-out-canary-assessment-20260904
  cancel-in-progress: false

jobs:
  finalize:
    name: verify, merge, verify main, and clean branches
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: metaforismo/continual-learning
      OWNER: metaforismo
      REPO: continual-learning
      PR_NUMBER: "21"
      EXPECTED_BASE: bf9926188c9f3c678bd84b5b9e506a22146e6080
      EXPECTED_HEAD_BRANCH: feat/held-out-canary-result-assessment-v1
    steps:
      - name: Checkout exact finalizer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - name: Verify PR identity, review state, and official CI
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git fetch --prune origin main "$EXPECTED_HEAD_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$pr_json")" = open
          test "$(jq -r '.draft' <<<"$pr_json")" = false
          test "$(jq -r '.base.ref' <<<"$pr_json")" = main
          test "$(jq -r '.base.sha' <<<"$pr_json")" = "$EXPECTED_BASE"
          test "$(jq -r '.head.ref' <<<"$pr_json")" = "$EXPECTED_HEAD_BRANCH"

          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          test -n "$head_sha"
          test "$head_sha" != null
          test "$(git rev-parse "origin/$EXPECTED_HEAD_BRANCH")" = "$head_sha"
          test "$(git rev-parse "$head_sha^")" = "$EXPECTED_BASE"

          open_same_head="$(gh api "repos/$REPOSITORY/pulls?state=open&head=$OWNER:$EXPECTED_HEAD_BRANCH&per_page=100")"
          test "$(jq 'length' <<<"$open_same_head")" -eq 1
          test "$(jq -r '.[0].number' <<<"$open_same_head")" = "$PR_NUMBER"

          changed_files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          test "$(jq 'length' <<<"$changed_files")" -gt 0
          test "$(jq '[.[] | select(.filename | startswith(".github/") or startswith("dist/") or startswith("node_modules/"))] | length' <<<"$changed_files")" -eq 0

          reviews="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")"
          test "$(jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length' <<<"$reviews")" -eq 0

          threads="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -f owner="$OWNER" \
            -f name="$REPO" \
            -F number="$PR_NUMBER")"
          test "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" -eq 0

          deadline=$((SECONDS + 900))
          while true; do
            runs="$(gh api "repos/$REPOSITORY/actions/runs?event=pull_request&head_sha=$head_sha&per_page=100")"
            run_id="$(jq -r --arg head "$head_sha" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $head)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            run_status="$(jq -r --arg head "$head_sha" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $head)] | sort_by(.created_at) | last | .status // "missing"' <<<"$runs")"
            run_conclusion="$(jq -r --arg head "$head_sha" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $head)] | sort_by(.created_at) | last | .conclusion // "pending"' <<<"$runs")"

            if [[ -n "$run_id" && "$run_status" == completed && "$run_conclusion" == success ]]; then
              jobs="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
              fixed="$(jq -r '[.jobs[] | select(.name == "Node 22.16.0")] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$jobs")"
              current="$(jq -r '[.jobs[] | select(.name == "Node 22.x")] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$jobs")"
              if [[ "$fixed" == success && "$current" == success ]]; then
                echo "pr_run_id=$run_id" >> "$GITHUB_OUTPUT"
                break
              fi
            fi

            if [[ "$run_status" == completed && "$run_conclusion" != success && "$run_conclusion" != pending ]]; then
              echo "required PR CI failed: $run_conclusion" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "timed out waiting for official PR CI" >&2
              exit 1
            fi
            sleep 10
          done

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Fresh exact-head validation
        shell: bash
        env:
          HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git diff --check "$EXPECTED_BASE" "$HEAD_SHA" --
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test test/canonical-canary-receipts.test.mjs
          node --test test/held-out-canary-result-assessment.test.mjs
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --check "$EXPECTED_BASE" "$HEAD_SHA" --

      - name: Squash merge exact reviewed head
        id: merge
        shell: bash
        env:
          HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA")"
          test "$(jq -r '.merged' <<<"$result")" = true
          merge_sha="$(jq -r '.sha' <<<"$result")"
          test -n "$merge_sha"
          test "$merge_sha" != null
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Fresh post-merge validation and official main CI
        id: postmerge
        shell: bash
        env:
          HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 180))
          while true; do
            git fetch --prune origin main
            if [[ "$(git rev-parse origin/main)" == "$MERGE_SHA" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "published main did not reach merge SHA" >&2
              exit 1
            fi
            sleep 3
          done

          head_tree="$(git rev-parse "$HEAD_SHA^{tree}")"
          main_tree="$(git rev-parse "$MERGE_SHA^{tree}")"
          test "$head_tree" = "$main_tree"

          git clean -ffdx
          git checkout --detach "$MERGE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test test/canonical-canary-receipts.test.mjs
          node --test test/held-out-canary-result-assessment.test.mjs
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --check HEAD^ HEAD --

          deadline=$((SECONDS + 900))
          while true; do
            runs="$(gh api "repos/$REPOSITORY/actions/runs?event=push&branch=main&head_sha=$MERGE_SHA&per_page=100")"
            run_id="$(jq -r --arg head "$MERGE_SHA" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $head)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            run_status="$(jq -r --arg head "$MERGE_SHA" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $head)] | sort_by(.created_at) | last | .status // "missing"' <<<"$runs")"
            run_conclusion="$(jq -r --arg head "$MERGE_SHA" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $head)] | sort_by(.created_at) | last | .conclusion // "pending"' <<<"$runs")"

            if [[ -n "$run_id" && "$run_status" == completed && "$run_conclusion" == success ]]; then
              jobs="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
              fixed="$(jq -r '[.jobs[] | select(.name == "Node 22.16.0")] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$jobs")"
              current="$(jq -r '[.jobs[] | select(.name == "Node 22.x")] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$jobs")"
              if [[ "$fixed" == success && "$current" == success ]]; then
                echo "main_run_id=$run_id" >> "$GITHUB_OUTPUT"
                break
              fi
            fi

            if [[ "$run_status" == completed && "$run_conclusion" != success && "$run_conclusion" != pending ]]; then
              echo "post-merge CI failed: $run_conclusion" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "timed out waiting for post-merge CI" >&2
              exit 1
            fi
            sleep 10
          done

          cat > /tmp/finalizer-evidence.txt <<EOF
          repository=$REPOSITORY
          pull_request=$PR_NUMBER
          base_sha=$EXPECTED_BASE
          feature_sha=$HEAD_SHA
          feature_tree=$head_tree
          merge_sha=$MERGE_SHA
          main_tree=$main_tree
          pr_ci_run=${{ steps.preflight.outputs.pr_run_id }}
          main_ci_run=$run_id
          node=22.16.0
          receipt_suite=success
          assessment_suite=success
          full_suite=success
          production_audit=success
          post_merge_validation=success
          EOF

      - name: Record verified integration
        shell: bash
        env:
          HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Exact-head finalization completed successfully.

          - feature head: \`$HEAD_SHA\`
          - squash merge / published main: \`$MERGE_SHA\`
          - official PR CI passed on Node 22.16.0 and Node 22.x
          - detached exact-head build, receipt suite, held-out assessment suite, full suite, diff check, and production audit passed
          - the published main tree equals the reviewed feature tree
          - fresh post-merge validation and official main CI passed
          - no scheduling, execution, rollback, lifecycle, or promotion authority was introduced
          EOF
          )
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

      - name: Upload finalizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: held-out-canary-result-assessment-finalizer-20260904
          path: /tmp/finalizer-evidence.txt
          if-no-files-found: error
          retention-days: 1

      - name: Delete integrated and temporary branches
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            feat/held-out-canary-result-assessment-v1
            tmp/publish-held-out-canary-result-assessment-v1
            tmp/finalize-held-out-canary-result-assessment-v1
            tmp/cleanup-held-out-assessment-finalization
            tmp/noop-output-probe
            tmp/release-transfer-anchor
            tmp/release-transfer-anchor-2
            tmp/release-upload-check
          )

          open="$(gh api "repos/$REPOSITORY/pulls?state=open&per_page=100")"
          for branch in "${branches[@]}"; do
            test "$(jq --arg branch "$branch" '[.[] | select(.head.ref == $branch)] | length' <<<"$open")" -eq 0
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

          git push origin --delete tmp/finalize-held-out-canary-assessment-20260904 || true
