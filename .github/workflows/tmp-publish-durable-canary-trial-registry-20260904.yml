name: Temporary publish durable canary trial registry 20260904

on:
  push:
    branches:
      - tmp/publish-durable-canary-trial-registry-20260904

permissions:
  contents: write

concurrency:
  group: publish-durable-canary-trial-registry-20260904
  cancel-in-progress: false

jobs:
  publish:
    name: reconstruct, validate, and publish exact feature tree
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FEATURE_BRANCH: feat/durable-canary-trial-registry-v1
      MANIFEST_URL: https://durable-registry-transfer-site.vercel.app/manifest.json
      PATCH_URL: https://durable-registry-transfer-site.vercel.app/durable-canary-trial-registry-v1.patch
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - name: Reconstruct and validate reviewed feature tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location "$MANIFEST_URL" --output /tmp/manifest.json
          curl --fail --silent --show-error --location "$PATCH_URL" --output /tmp/feature.patch

          test "$(jq -r '.schema_version' /tmp/manifest.json)" = 1
          test "$(jq -r '.repository' /tmp/manifest.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.feature_branch' /tmp/manifest.json)" = "$FEATURE_BRANCH"

          expected_base="$(jq -r '.base_sha' /tmp/manifest.json)"
          expected_base_tree="$(jq -r '.base_tree' /tmp/manifest.json)"
          expected_tree="$(jq -r '.reviewed_feature_tree' /tmp/manifest.json)"
          expected_patch_sha="$(jq -r '.patch_sha256' /tmp/manifest.json)"

          test -n "$expected_base"
          test -n "$expected_base_tree"
          test -n "$expected_tree"
          test -n "$expected_patch_sha"
          test "$(git rev-parse HEAD^)" = "$expected_base"

          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$expected_base"
          test "$(git rev-parse "$expected_base^{tree}")" = "$expected_base_tree"

          if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" >/dev/null 2>&1; then
            echo "feature branch already exists" >&2
            exit 1
          fi

          echo "$expected_patch_sha  /tmp/feature.patch" | sha256sum --check --strict

          git checkout --detach "$expected_base"
          git apply --check /tmp/feature.patch
          git apply --index /tmp/feature.patch
          git diff --cached --check

          git diff --cached --name-only | sort > /tmp/actual-files.txt
          jq -r '.changed_files[]' /tmp/manifest.json | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test -z "$(grep -E '^(\.github/|dist/|node_modules/|tmp/)' /tmp/actual-files.txt || true)"
          test -f test/durable-canary-trial-registry.test.mjs

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test test/durable-canary-trial-registry.test.mjs
          node --test test/canonical-canary-receipts.test.mjs
          node --test test/held-out-canary-result-assessment.test.mjs
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --cached --check

          git config user.name "metaforismo"
          git config user.email "39646696+metaforismo@users.noreply.github.com"
          git commit -m "feat: add durable canary trial registry"

          feature_sha="$(git rev-parse HEAD)"
          feature_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$expected_base"
          test "$feature_tree" = "$expected_tree"
          test -z "$(git status --porcelain)"

          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"

          cat > /tmp/publication-evidence.txt <<EOF
          repository=$GITHUB_REPOSITORY
          base_sha=$expected_base
          base_tree=$expected_base_tree
          feature_branch=$FEATURE_BRANCH
          feature_sha=$feature_sha
          feature_tree=$feature_tree
          patch_sha256=$expected_patch_sha
          node=22.16.0
          dedicated_registry_suite=success
          canonical_receipt_suite=success
          held_out_assessment_suite=success
          full_suite=success
          production_audit=success
          diff_check=success
          EOF

          echo "feature_sha=$feature_sha" >> "$GITHUB_OUTPUT"
          echo "feature_tree=$feature_tree" >> "$GITHUB_OUTPUT"

      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-canary-trial-registry-publication-20260904
          path: /tmp/publication-evidence.txt
          if-no-files-found: error
          retention-days: 1

      - name: Delete temporary publication branch
        if: success()
        shell: bash
        run: git push origin --delete tmp/publish-durable-canary-trial-registry-20260904 || true
