name: Apply final FTS5 patch (temporary)

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fts5-projection-v1-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/fts-product.patch.hex.* > /tmp/fts-product.hex
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/fts-product.patch.gz').write_bytes(
              bytes.fromhex(Path('/tmp/fts-product.hex').read_text())
          )
          PY
          gunzip -t /tmp/fts-product.patch.gz
          gunzip -c /tmp/fts-product.patch.gz > /tmp/fts-product.patch
          echo '6323fad4d428a37fdac5c0af6c05d1e252d21bd2b7d1d9a5b01b2f63bdbb0db9  /tmp/fts-product.patch' | sha256sum -c -
          git apply --check /tmp/fts-product.patch
          git apply --index /tmp/fts-product.patch
          rm -rf .tmp
          rm -f .github/workflows/apply-fts5-final.yml
          rm -f .github/workflows/apply-fts5-hex.yml
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log || {
            echo '--- npm ci failure ---'
            tail -n 120 /tmp/npm-ci.log
            exit 1
          }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log || {
            echo '--- build failure ---'
            tail -n 160 /tmp/build.log
            exit 1
          }
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          node --test test/*.test.mjs 2>&1 | tee /tmp/test.log || {
            echo '--- test failure ---'
            tail -n 220 /tmp/test.log
            exit 1
          }
      - name: Check staged diff
        run: git diff --check --cached
      - name: Commit final branch
        run: |
          git config user.name metaforismo
          git config user.email 39646696+metaforismo@users.noreply.github.com
          git add -A
          git commit -m 'fix: harden and finalize FTS5 projection'
          git push origin HEAD:feat/fts5-projection-v1-final
