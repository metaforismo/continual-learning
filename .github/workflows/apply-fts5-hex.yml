name: Apply final FTS5 patch (temporary)

on:
  push:
    branches:
      - feat/fts5-projection-v1-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fts5-projection-v1-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/fts-product.patch.hex.* > /tmp/fts-product.hex
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/fts-product.patch.gz').write_bytes(
              bytes.fromhex(Path('/tmp/fts-product.hex').read_text())
          )
          PY
          gunzip -t /tmp/fts-product.patch.gz
          gunzip -c /tmp/fts-product.patch.gz > /tmp/fts-product.patch
          echo '6323fad4d428a37fdac5c0af6c05d1e252d21bd2b7d1d9a5b01b2f63bdbb0db9  /tmp/fts-product.patch' | sha256sum -c -
          git apply --check /tmp/fts-product.patch
          git apply /tmp/fts-product.patch
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('package.json'): ('>=22.13.0', '>=22.16.0'),
              Path('package-lock.json'): ('>=22.13.0', '>=22.16.0'),
              Path('README.md'): ('Node.js 22.13+', 'Node.js 22.16.0+'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {old!r}, found {count}')
              path.write_text(text.replace(old, new))
          PY
          rm -rf .tmp
          rm -f .github/workflows/apply-fts5-final.yml
          rm -f .github/workflows/apply-fts5-hex.yml
          rm -f .github/workflows/probe-node-fts5.yml
          git add -A
          git diff --check --cached
      - name: Verify runtime capability
        shell: bash
        run: |
          node --no-warnings - <<'NODE'
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync(':memory:');
          const options = db.prepare('PRAGMA compile_options').all().map((row) => Object.values(row)[0]);
          if (!options.includes('ENABLE_FTS5')) throw new Error('Node SQLite build lacks ENABLE_FTS5');
          db.exec('CREATE VIRTUAL TABLE probe USING fts5(content)');
          console.log(JSON.stringify({ node: process.version, sqlite: db.prepare('SELECT sqlite_version() AS version').get().version, enableFts5: true }));
          db.close();
          NODE
      - name: Verify final branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit final branch
        run: |
          git config user.name metaforismo
          git config user.email 39646696+metaforismo@users.noreply.github.com
          git commit -m 'fix: harden and finalize FTS5 projection'
          git push origin HEAD:feat/fts5-projection-v1-final
